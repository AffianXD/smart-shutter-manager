name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python ast_walker.py custom_components/smart_shutter
      - run: python method_ref_checker.py custom_components/smart_shutter/www/smart-shutter-card.js
      - run: python -m compileall -q custom_components/smart_shutter

  home-assistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - homeassistant: '2026.3.0'
            pytest_plugin: '0.13.317'
            frontend: '20260304.0'
          - homeassistant: '2026.9.4'
            pytest_plugin: '0.13.367'
            frontend: '20260826.7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install "pytest-homeassistant-custom-component==${{ matrix.pytest_plugin }}" "home-assistant-frontend==${{ matrix.frontend }}"
      - run: python -m pip install --no-deps "homeassistant==${{ matrix.homeassistant }}"
      - run: python -m pytest -q

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:card
      - run: npm run test:card

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
