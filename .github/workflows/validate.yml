name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python ast_walker.py custom_components/smart_shutter
      - run: python method_ref_checker.py custom_components/smart_shutter/www/smart-shutter-card.js
      - run: python -m compileall -q custom_components/smart_shutter

  home-assistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - homeassistant: '2026.3.0'
            pytest_plugin: '0.13.317'
            frontend: '20260304.0'
          - homeassistant: '2026.9.4'
            pytest_plugin: '0.13.367'
            frontend: '20260826.7'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install "pytest-homeassistant-custom-component==${{ matrix.pytest_plugin }}" "home-assistant-frontend==${{ matrix.frontend }}"
      - run: python -m pip install --no-deps "homeassistant==${{ matrix.homeassistant }}"
      - run: python -m pytest -q

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:card
      - run: npm run test:card

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  version-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check version and changelog on branch pushes
        if: >-
          github.event_name == 'push' && github.event.deleted != true &&
          !startsWith(github.ref, 'refs/tags/')
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH" || true)"
          fi
          python scripts/check_version_changelog.py "$BASE_SHA" "$HEAD_SHA"
      - name: Check version and changelog on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_version_changelog.py "$BASE_SHA" "$HEAD_SHA"
      - name: Check release tag against integration manifest
        if: >-
          github.event_name == 'push' && github.event.deleted != true &&
          startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_tag.py "$RELEASE_TAG"

  release-candidate:
    if: >-
      github.event_name == 'push' && github.event.deleted != true &&
      (startsWith(github.ref, 'refs/tags/v') ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve and validate release tag
        id: candidate
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              echo "No previous default-branch commit; no release candidate to publish."
              exit 0
            fi

            BASE_VERSION="$(git show "$BASE_SHA:custom_components/smart_shutter/manifest.json" | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
            HEAD_VERSION="$(python -c 'import json; print(json.load(open("custom_components/smart_shutter/manifest.json"))["version"])')"
            if [[ "$BASE_VERSION" == "$HEAD_VERSION" ]]; then
              echo "Integration version is unchanged; no release candidate to publish."
              exit 0
            fi
            RELEASE_TAG="v$HEAD_VERSION"
          else
            echo "This push is not a release candidate."
            exit 0
          fi

          python scripts/check_release_tag.py "$RELEASE_TAG"

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG points at $TAG_SHA, expected $HEAD_SHA."
              exit 1
            fi
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  publish-release:
    if: >-
      github.event_name == 'push' && github.event.deleted != true &&
      needs.release-candidate.outputs.tag != ''
    needs:
      - backend
      - home-assistant-compatibility
      - card
      - hassfest
      - hacs
      - version-policy
      - release-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-candidate.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
