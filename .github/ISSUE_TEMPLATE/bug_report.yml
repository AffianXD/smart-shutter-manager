name: Bug report
description: Report a reproducible Smart Shutter Manager problem.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.9.4
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Smart Shutter Manager version
      placeholder: 0.28.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, addresses, and private entity names before posting.
      render: text
    validations:
      required: false
